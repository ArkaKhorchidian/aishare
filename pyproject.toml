[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aishare"
version = "0.1.0"
description = "How much of the code you shipped did AI write? Matches git blame against Claude Code, Codex and Gemini CLI session logs and AI co-author trailers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13"]
keywords = ["ai", "git", "claude-code", "codex", "gemini-cli", "copilot", "git-blame", "developer-tools", "statistics", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aishare = "aishare.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/aishare"
Issues = "https://github.com/ArkaKhorchidian/aishare/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aishare"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
